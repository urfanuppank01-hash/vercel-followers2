<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vercel Followers Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}.ticker{height:32px;overflow:hidden;border-bottom:1px solid #eee;display:flex;align-items:center;white-space:nowrap}.ticker-track{display:flex;width:max-content;animation:scroll 28s linear infinite;font-size:12px}.ticker-group{display:flex;align-items:center}.item{display:inline-block}.sep{display:inline-block;margin:0 10px;color:#777}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}.container{max-width:520px;margin:45px auto;padding:20px}.panel{border:1px solid #e5e5e5;border-radius:14px;padding:24px;box-shadow:0 5px 20px #00000008}h1{text-align:center;font-size:24px;margin:0 0 25px}label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}select,input{width:100%;height:45px;border:1px solid #ddd;border-radius:9px;padding:0 13px;font-size:14px;margin-bottom:17px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;height:46px;border:0;border-radius:10px;background:#1677ff;color:white;font-weight:600;cursor:pointer}#payment{display:none;margin-top:20px}.payment{border:1px solid #e5e5e5;border-radius:14px;padding:22px;text-align:center}.details{text-align:left;background:#f8f8f8;padding:15px;border-radius:10px;font-size:13px;line-height:1.8}.new{margin-top:20px;background:#111}@media(max-width:600px){.container{margin:25px auto;padding:15px}.row{grid-template-columns:1fr}}
</style></head><body>
<div class="ticker"><div class="ticker-track" id="track"></div></div>
<div class="container"><div class="panel"><h1>Vercel Followers</h1>
<label>Kategori</label><select id="cat"><option value="">Pilih Kategori</option><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Facebook</option></select>
<label>Layanan</label><select id="svc"><option value="">Pilih Layanan</option></select>
<label>Link / Username</label><input id="target" placeholder="Masukkan link atau username">
<label>Jumlah</label><input id="qty" type="number" min="1000" value="1000">
<div class="row"><div><label>Harga</label><input id="price" readonly></div><div><label>Total</label><input id="total" readonly></div></div>
<button onclick="order()">Order</button></div>
<div id="payment"><div class="payment"><h2>Pembayaran</h2><b id="ord"></b><div class="details"><div><b>Kategori:</b> <span id="pc"></span></div><div><b>Layanan:</b> <span id="ps"></span></div><div><b>Target:</b> <span id="pt"></span></div><div><b>Jumlah:</b> <span id="pq"></span></div><div><b>Total:</b> <span id="ptot"></span></div></div><button class="new" onclick="location.reload()">Buat Pesanan Baru</button></div></div></div>
<script>
const services={TikTok:[["TikTok Followers Tanpa Drop",25000,1000],["TikTok Likes Tanpa Drop",6000,1000],["TikTok Views Tanpa Drop",8000,1000]],Instagram:[["Instagram Followers Anti Drop",20000,1000],["Instagram Likes Foto Anti Drop",5000,1000],["Instagram Likes Video/Reels Anti Drop",7000,1000],["Instagram Views Anti Drop",8000,1000],["Instagram Saves Anti Drop",5000,1000]],YouTube:[["YouTube Subscriber",40000,1000],["YouTube Short/Video Views",45000,1000],["YouTube Short/Video Likes",15000,1000]],Facebook:[["Facebook Pengikut",20000,1000],["Facebook Share",9000,1000],["Facebook Views Video/Reels",35000,1000]]};
const ticker=[["TikTok","Followers No Drop"],["TikTok","Likes No Drop"],["Instagram","Followers Anti Drop"],["Instagram","Likes Foto Anti Drop"],["YouTube","Subscriber"],["YouTube","Short/Video Views"],["Facebook","Pengikut"],["Facebook","Share"]];
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";function code(){let x="VF-";for(let i=0;i<10;i++)x+=chars[Math.floor(Math.random()*chars.length)];return x}function q(){return [1000,2000,3000,5000,10000][Math.floor(Math.random()*5)]}
function makeGroup(){return ticker.map(x=>`<span class="item">${code()} baru saja memesan ${q().toLocaleString("id-ID")} (${x[1]})</span><span class="sep">|</span>`).join("")}
document.getElementById("track").innerHTML='<div class="ticker-group">'+makeGroup()+'</div><div class="ticker-group">'+makeGroup()+'</div>';
cat.onchange=()=>{svc.innerHTML='<option value="">Pilih Layanan</option>';(services[cat.value]||[]).forEach((x,i)=>{let o=document.createElement("option");o.value=i;o.textContent=x[0]+" - Rp"+x[1].toLocaleString("id-ID")+"/1.000";svc.appendChild(o)});calc()};
function calc(){if(cat.value&&svc.value!==""){let x=services[cat.value][svc.value],n=+qty.value||0;price.value="Rp"+x[1].toLocaleString("id-ID")+" / 1.000";total.value="Rp"+((x[1]/1000)*n).toLocaleString("id-ID")}else price.value=total.value=""}svc.onchange=calc;qty.oninput=calc;
function order(){let t=target.value.trim(),n=+qty.value;if(!cat.value||svc.value==="")return alert("Pilih kategori dan layanan.");if(!t)return alert("Masukkan link atau username.");if(n<1000)return alert("Minimal order 1.000.");let x=services[cat.value][svc.value];if(n%1000)return alert("Jumlah harus kelipatan 1.000.");ord.textContent=code();pc.textContent=cat.value;ps.textContent=x[0];pt.textContent=t;pq.textContent=n.toLocaleString("id-ID");ptot.textContent=total.value;payment.style.display="block";payment.scrollIntoView({behavior:"smooth"})}
</script></body></html>
